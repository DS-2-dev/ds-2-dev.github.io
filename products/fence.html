</head>
<body class="with-subheader loading-active">
  <header class="app-header">
    <nav class="nav">
      <div class="nav-left">
        <div class="brand-group">
          <a href="/" class="logo-link" aria-label="Home">
            <img src="../logomini.png" alt="Logo" class="logo">
          </a>
          <a href="/" class="brand-name">Citri Software</a>
        </div>
        <ul class="nav-links" role="navigation" aria-label="Main navigation">
          <li><a class="frutiger-aero-button" href="../products.html" aria-current="page">Products</a></li>
          <li><a class="frutiger-aero-button" href="../support.html">Customer Support</a></li>
          <li><a class="frutiger-aero-button" href="../legal.html">Legal Notice</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <div class="sub-header" role="region" aria-label="Products sub header">
    <div class="sub-bar-inner">
      <div class="sub-actions">
        <a class="frutiger-aero-button small" href="../products.html">All Products</a>
        <a class="frutiger-aero-button small" href="fence.html" aria-current="page">Fence!</a>
      </div>
    </div>
  </div>

  <main class="main">
    <!-- Coming soon card with countdown -->
    <div style="min-height:240px; display:flex; align-items:center; justify-content:center; width:100%;">
      <div class="product-card stacked" role="region" aria-label="Fence coming soon" style="text-align:center; max-width:420px;">
        <h3 class="card-title" style="margin:0 0 8px 0; font-size:2.6rem;">6.6.2026</h3>
        <div id="countdown" aria-live="polite" style="font-size:1.6rem; font-weight:800; color:#0b1220; margin-top:8px; text-align:center;">--d --h --m --s</div>
      </div>
    </div>
    <script>
      (function () {
        // Target date: 6 June 2026 at 00:00:00 UTC
        const target = new Date('2026-06-06T00:00:00Z');
        const el = document.getElementById('countdown');
        if (!el) return;
        function pad(n){ return String(n).padStart(2,'0'); }
        function update(){
          const now = new Date();
          let diff = Math.max(0, target - now);
          const days = Math.floor(diff / 86400000);
          diff %= 86400000;
          const hours = Math.floor(diff / 3600000);
          diff %= 3600000;
          const minutes = Math.floor(diff / 60000);
          const seconds = Math.floor((diff % 60000) / 1000);
          el.textContent = `${pad(days)}d ${pad(hours)}h ${pad(minutes)}m ${pad(seconds)}s`;
        }
        update();
        const timer = setInterval(function(){ update(); if (new Date() >= target) clearInterval(timer); }, 1000);
      })();
    </script>
  </main>

  <div class="bottom-subbar" role="contentinfo" aria-label="Bottom site bar">
