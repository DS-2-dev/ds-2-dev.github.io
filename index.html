<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citri Software</title>
    <style>
        @font-face {
            font-family: 'NeutronD';
            src: url('neutrond.ttf') format('truetype');
            font-weight: 300 900;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'NeutronD', "Lucida Grande", "Lucida Sans Unicode", Helvetica, Arial, sans-serif;
            background-color: #000000;
            margin: 0;
            padding: 0;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            cursor: default;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            perspective: 1000px;
        }

        .launch-date {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        .timer-display {
            display: flex;
            font-size: 64px;
            font-weight: bold;
            line-height: 1;
            transform: perspective(600px) rotateX(8deg) scale(1.1);
            transform-style: preserve-3d;
            
            /* Stronger reflection: Opacity increased to 0.4 */
            -webkit-box-reflect: below -8px linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.4) 100%);
        }

        .unit-group {
            display: flex;
            align-items: baseline;
            margin-right: 32px; 
        }

        .unit-group:last-child {
            margin-right: 0;
        }

        .slot {
            height: 1em;
            width: 0.65em; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .column {
            transition: transform 0.6s cubic-bezier(0.45, 0.05, 0.55, 0.95);
            display: flex;
            flex-direction: column;
        }

        .column span {
            height: 1em;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .label {
            font-size: 32px;
            margin-left: 4px;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="launch-date">6.6.2026</div>
        <div id="timer" class="timer-display"></div>
    </div>

    <script>
        const targetDate = new Date('2026-06-06T00:00:00').getTime();
        const timerContainer = document.getElementById('timer');

        function createColumn() {
            const slot = document.createElement('div');
            slot.className = 'slot';
            const column = document.createElement('div');
            column.className = 'column';
            for (let i = 0; i <= 9; i++) {
                const span = document.createElement('span');
                span.innerText = i;
                column.appendChild(span);
            }
            slot.appendChild(column);
            return { slot, column };
        }

        let slots = [];

        function initTimer() {
            const groups = [
                { label: 'd', digits: 2 }, 
                { label: 'h', digits: 2 },
                { label: 'm', digits: 2 },
                { label: 's', digits: 2 }
            ];

            groups.forEach(group => {
                const groupWrapper = document.createElement('div');
                groupWrapper.className = 'unit-group';

                for (let i = 0; i < group.digits; i++) {
                    const colObj = createColumn();
                    groupWrapper.appendChild(colObj.slot);
                    slots.push(colObj.column);
                }

                const labelSpan = document.createElement('span');
                labelSpan.className = 'label';
                labelSpan.innerText = group.label;
                groupWrapper.appendChild(labelSpan);

                timerContainer.appendChild(groupWrapper);
            });
        }

        function updateTimer() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                timerContainer.innerHTML = "Launched!";
                return;
            }

            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);

            const timeString = 
                String(d).padStart(2, '0') + 
                String(h).padStart(2, '0') + 
                String(m).padStart(2, '0') + 
                String(s).padStart(2, '0');

            [...timeString].forEach((digit, i) => {
                if (slots[i]) {
                    const moveAmount = digit * -1;
                    slots[i].style.transform = `translateY(${moveAmount}em)`;
                }
            });
        }

        initTimer();
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
